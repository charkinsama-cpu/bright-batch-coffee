<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Gather, Grind, Grow</title>
  <desc id="logoDesc">Cream field with terracotta coffee-bean mark and espresso serif wordmark</desc>
  <rect width="280" height="72" rx="8" fill="#F5F0E8"/>
  <!-- Coffee bean mark -->
  <g transform="translate(16, 14)">
    <ellipse cx="22" cy="22" rx="18" ry="22" fill="#C4785A"/>
    <path d="M22 4 C14 14 14 30 22 40 C30 30 30 14 22 4 Z" fill="none" stroke="#3C2A21" stroke-width="1.75" stroke-linecap="round" opacity="0.55"/>
    <path d="M22 8 C17 16 17 28 22 36" fill="none" stroke="#F5F0E8" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>
  </g>
  <!-- Wordmark -->
  <text x="64" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" fill="#3C2A21">Gather, Grind, Grow</text>
</svg>
