<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520" role="img" aria-label="Gather, Grind, Grow logo">
  <title>Gather, Grind, Grow</title>
  <!-- transparent -->

  <!-- grounds -->
  <g fill="#5C4033">
    <ellipse cx="200" cy="196" rx="56" ry="18"/>
    <circle cx="164" cy="190" r="3"/><circle cx="174" cy="198" r="2.4"/>
    <circle cx="184" cy="188" r="2.8"/><circle cx="194" cy="200" r="3"/>
    <circle cx="204" cy="189" r="2.5"/><circle cx="214" cy="197" r="2.7"/>
    <circle cx="224" cy="191" r="2.3"/><circle cx="234" cy="198" r="2.2"/>
    <circle cx="170" cy="194" r="1.8"/><circle cx="190" cy="194" r="2"/>
    <circle cx="210" cy="202" r="2"/><circle cx="220" cy="186" r="1.7"/>
  </g>

  <!-- bean upright, no tilt for clear sprout placement -->
  <ellipse cx="200" cy="148" rx="34" ry="50" fill="#C4785A"/>

  <!-- white split / crease through bean -->
  <path d="M200 104
           C192 120, 192 176, 200 196
           C208 176, 208 120, 200 104 Z" fill="#F5F0E8"/>

  <!-- sprout: stem begins INSIDE the upper white split (y=120 is well inside bean; bean top is y=98) -->
  <g id="sprout">
    <!-- stem rooted inside split -->
    <path d="M200 128 L200 88" fill="none" stroke="#6F8F5E" stroke-width="3" stroke-linecap="round"/>
    <!-- leaves above the bean -->
    <ellipse cx="188" cy="82" rx="9" ry="5" fill="#8AAB78" transform="rotate(-40 188 82)"/>
    <ellipse cx="212" cy="82" rx="9" ry="5" fill="#8AAB78" transform="rotate(40 212 82)"/>
  </g>

  <!-- soft highlight on split edges near where stem exits so it reads as emerging from crease -->
  <path d="M196 108 C198 102, 202 102, 204 108" fill="none" stroke="#C4785A" stroke-width="2" stroke-linecap="round" opacity="0.35"/>

  <g fill="#3B2A22" font-family="Georgia, 'Times New Roman', serif" font-size="36" text-anchor="middle">
    <text x="200" y="270">Gather,</text>
    <text x="200" y="320">Grind,</text>
    <text x="200" y="370">Grow.</text>
  </g>
</svg>
